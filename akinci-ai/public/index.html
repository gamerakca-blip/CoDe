<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Akıncı AI</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="vendor/hljs-theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-name">AKINCI</span><span class="brand-ai">AI</span>
      </div>

      <div class="desk">
        <div class="mascot mascot-lg" data-state="coffee" aria-hidden="true"></div>
        <div class="desk-floor"></div>
        <p class="status" id="status" aria-live="polite">Kahve içiyor</p>
      </div>

      <button class="btn btn-ghost" id="newChat" type="button">+ Yeni sohbet</button>
      <p class="meta" id="meta"></p>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="mascot mascot-sm" data-state="coffee" aria-hidden="true"></div>
        <div class="topbar-text">
          <span class="brand-name">AKINCI</span><span class="brand-ai">AI</span>
          <span class="status status-sm" id="statusSm">Kahve içiyor</span>
        </div>
        <button class="btn btn-ghost btn-icon" id="newChatSm" type="button" aria-label="Yeni sohbet">+</button>
      </header>

      <section class="chat" id="chat">
        <div class="empty" id="empty">
          <h1 class="empty-title">Ne yazalım?</h1>
          <p class="empty-sub">Kod yazar, hata ayıklar, Osmanlı tarihini ve Osmanlıcayı anlatır.</p>
          <p class="chips-label">Kod</p>
          <div class="chips">
            <button class="chip" type="button">Python ile klasördeki dosyaları tarihe göre yeniden adlandıran betik yaz</button>
            <button class="chip" type="button">React'te sürükle-bırak yapılacaklar listesi yap</button>
            <button class="chip" type="button">Express ile JWT girişli REST API kur</button>
          </div>
          <p class="chips-label">Osmanlı</p>
          <div class="chips">
            <button class="chip" type="button">Kanuni Sultan Süleyman dönemini ana hatlarıyla anlat</button>
            <button class="chip" type="button">"Devlet-i Aliyye-i Osmaniyye" ne demek, kelimelerin kökeni ne?</button>
            <button class="chip" type="button">Hicri tarihi Miladi tarihe çeviren TypeScript fonksiyonu yaz</button>
          </div>
        </div>
        <ol class="messages" id="messages"></ol>
      </section>

      <form class="composer" id="composer">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="Kod iste veya Osmanlı hakkında sor…" autocomplete="off" required></textarea>
          <button class="btn btn-send" id="send" type="submit" aria-label="Gönder">
            <svg viewBox="0 0 8 8" width="16" height="16" shape-rendering="crispEdges"><path fill="currentColor" d="M3 0h2v1h1v1h1v1h1v1H5v4H3V4H0V3h1V2h1V1h1z"/></svg>
          </button>
          <button class="btn btn-stop" id="stop" type="button" aria-label="Durdur" hidden>
            <svg viewBox="0 0 8 8" width="14" height="14" shape-rendering="crispEdges"><path fill="currentColor" d="M1 1h6v6H1z"/></svg>
          </button>
        </div>
        <p class="hint">Enter gönderir · Shift+Enter yeni satır</p>
      </form>
    </main>
  </div>

  <script src="vendor/highlight.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
